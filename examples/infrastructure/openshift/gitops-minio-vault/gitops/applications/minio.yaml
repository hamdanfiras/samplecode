apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-vault
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/samplecode.git
    targetRevision: main
    path: examples/infrastructure/openshift/gitops-minio-vault/gitops/minio
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
