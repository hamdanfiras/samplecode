apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minio-vault.fullname" . }}
  labels:
    {{- include "minio-vault.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "minio-vault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minio-vault.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "minio-vault.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - /data
            - --address
            - ":{{ .Values.service.apiPort }}"
            - --console-address
            - ":{{ .Values.service.consolePort }}"
          env:
            - name: MINIO_ROOT_USER_FILE
              value: {{ printf "%s/%s" .Values.vault.mountPath .Values.vault.files.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD_FILE
              value: {{ printf "%s/%s" .Values.vault.mountPath .Values.vault.files.rootPassword | quote }}
            - name: MINIO_BROWSER
              value: {{ .Values.minio.browser | quote }}
            - name: MINIO_SITE_REGION
              value: {{ .Values.minio.siteRegion | quote }}
            - name: HOME
              value: /tmp/minio-home
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            - name: console
              containerPort: {{ .Values.service.consolePort }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: minio-home
              mountPath: /tmp/minio-home
            - name: vault-secrets
              mountPath: {{ .Values.vault.mountPath | quote }}
              readOnly: true
      volumes:
        - name: minio-home
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "minio-vault.fullname" . }}-data
        {{- include "minio-vault.vaultVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
