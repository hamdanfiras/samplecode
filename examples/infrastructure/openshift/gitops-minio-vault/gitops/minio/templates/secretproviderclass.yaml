{{- if .Values.vault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "minio-vault.fullname" . }}-vault
  labels:
    {{- include "minio-vault.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    roleName: {{ .Values.vault.roleName | quote }}
    {{- if .Values.vault.vaultAddress }}
    vaultAddress: {{ .Values.vault.vaultAddress | quote }}
    {{- end }}
    objects: |
      - objectName: {{ .Values.vault.files.rootUser | quote }}
        secretPath: {{ .Values.vault.secretPath | quote }}
        secretKey: {{ .Values.vault.keys.rootUser | quote }}
      - objectName: {{ .Values.vault.files.rootPassword | quote }}
        secretPath: {{ .Values.vault.secretPath | quote }}
        secretKey: {{ .Values.vault.keys.rootPassword | quote }}
      - objectName: {{ .Values.vault.files.serviceUser | quote }}
        secretPath: {{ .Values.vault.secretPath | quote }}
        secretKey: {{ .Values.vault.keys.serviceUser | quote }}
      - objectName: {{ .Values.vault.files.servicePassword | quote }}
        secretPath: {{ .Values.vault.secretPath | quote }}
        secretKey: {{ .Values.vault.keys.servicePassword | quote }}
{{- end }}
